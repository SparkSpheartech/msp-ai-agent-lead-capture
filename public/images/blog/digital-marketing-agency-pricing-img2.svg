<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="420" fill="#0f172a"/>
  <text x="380" y="40" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">What a Monthly Retainer Buys, 2026</text>
  <text x="380" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">Typical monthly ranges for small-to-mid-market engagements (Scopic Studios, Clutch, DesignRush)</text>
  <g font-size="12" fill="#cbd5e1">
    <text x="30" y="108">$500/mo - contractor / single task</text>
    <rect x="30" y="118" width="50" height="26" fill="#475569"/>
    <text x="88" y="136" fill="#f8fafc">~$500</text>
    <text x="30" y="178">$2,000/mo - one channel, done properly</text>
    <rect x="30" y="188" width="170" height="26" fill="#38bdf8"/>
    <text x="208" y="206" fill="#f8fafc">$1,000-$3,000</text>
    <text x="30" y="248">$5,000/mo - 2-3 channels + strategy</text>
    <rect x="30" y="258" width="240" height="26" fill="#34d399"/>
    <text x="278" y="276" fill="#f8fafc">$3,500-$5,500</text>
    <text x="30" y="318">Mid-market agency - full account team</text>
    <rect x="30" y="328" width="360" height="26" fill="#fbbf24"/>
    <text x="398" y="346" fill="#f8fafc">$7,500-$15,000</text>
    <text x="30" y="388">Ad spend billed separately: add 10-20% of spend as management fee on paid channels</text>
  </g>
  <text x="380" y="412" text-anchor="middle" fill="#64748b" font-size="11">Sources: Scopic Studios 2026; Clutch pricing guide 2026; DesignRush pricing guide, retrieved 2026-10-21</text>
</svg>