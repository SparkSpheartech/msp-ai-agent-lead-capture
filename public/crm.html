<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>SparkSphear CRM</title>
 <script src="https://cdn.tailwindcss.com"></script>
 <style>
 .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
 </style>
</head>
<body class="bg-black text-white min-h-screen font-sans">
 <div class="max-w-6xl mx-auto px-4 py-8">
 <div class="flex justify-between items-center mb-6">
 <div>
 <h1 class="text-3xl font-bold text-lime-400">SparkSphear CRM</h1>
 <p class="text-gray-400">Operational Efficiency Leads</p>
 </div>
 <div class="text-sm">
 <a href="/pricing" class="text-lime-400 underline">Pricing</a>
 </div>
 </div>
 
 <div class="mb-4 flex gap-3">
 <input id="searchInput" type="text" placeholder="Search businesses..." 
 class="flex-1 px-4 py-2 bg-zinc-900 border border-gray-700 rounded-lg" 
 onkeyup="searchLeads()">
 <select id="statusFilter" class="px-4 py-2 bg-zinc-900 border border-gray-700 rounded-lg" onchange="filterStatus()">
 <option>All Status</option>
 <option>New</option>
 <option>Contacted</option>
 <option>Demo</option>
 <option>Pilot</option>
 <option>Closed</option>
 </select>
 <button onclick="exportToCSV()" class="px-4 py-2 bg-lime-400 text-black font-bold rounded-lg hover:bg-lime-300">Export</button>
 </div>
 
 <div class="bg-zinc-900/50 rounded-xl overflow-hidden">
 <table class="w-full text-sm">
 <thead class="bg-black/50 border-b border-gray-800">
 <tr>
 <th class="px-4 py-3 text-left font-normal">Business</th>
 <th class="px-4 py-3 text-left font-normal">Phone</th>
 <th class="px-4 py-3 text-left font-normal">Product Fit</th>
 <th class="px-4 py-3 text-left font-normal">Notes</th>
 <th class="px-4 py-3 text-left font-normal">Status</th>
 <th class="px-4 py-3 text-left font-normal">Action</th>
 </tr>
 </thead>
 <tbody id="leadsBody">
 </tbody>
 </table>
 </div>
 </div>

 <script>
 // Leads data - can be fetched from /api/leads later
 let leads = [
 {business: 'Smooth Move Movers & Junk Removal', phone: '(260) 206-0434', product: 'Waste CallGuard', status: 'New', notes: 'High missed-call potential. 2-5 trucks.'},
 {business: 'Junk Dawgs', phone: '(260) 410-7297', product: 'DumpsterQuote Bot', status: 'New', notes: 'No online booking. Manual quotes.'},
 {business: '1-800-GOT-JUNK ', phone: '(260) 999-5466', product: 'RouteSync Driver Bot', status: 'New', notes: 'Franchise locally operated.'},
 {business: 'A+ Junk Removal', phone: '(260) 615-4506', product: 'Waste CallGuard', status: 'New', notes: 'Answering machine. High missed-call risk.'},
 {business: 'Affordable Dumpster Rental', phone: '(260) 399-6200', product: 'DumpsterQuote Bot', status: 'New', notes: 'No online booking'}
 ];

 function renderLeads(list) {
 const tbody = document.getElementById('leadsBody');
 tbody.innerHTML = list.map(l => `
 <tr class="border-t border-gray-800 hover:bg-zinc-800/30">
 <td class="px-4 py-3 font-bold">${l.business}</td>
 <td class="px-4 py-3 font-mono">${l.phone}</td>
 <td class="px-4 py-3">
 <span class="px-2 py-1 bg-lime-400/20 text-lime-400 rounded text-xs">${l.product}</span>
 </td>
 <td class="px-4 py-3 text-gray-400 text-xs line-clamp-2">${l.notes}</td>
 <td class="px-4 py-3">
 <select onchange="updateLeadStatus(this, '${l.phone}')" class="bg-black border border-gray-600 rounded px-2 py-1 text-xs">
 <option ${l.status === 'New' ? 'selected' : ''}>New</option>
 <option ${l.status === 'Contacted' ? 'selected' : ''}>Contacted</option>
 <option ${l.status === 'Demo' ? 'selected' : ''}>Demo</option>
 <option ${l.status === 'Pilot' ? 'selected' : ''}>Pilot</option>
 <option ${l.status === 'Closed' ? 'selected' : ''}>Closed</option>
 </select>
 </td>
 <td class="px-4 py-3">
 <button onclick="callBusiness('${l.phone}')" class="px-3 py-1 bg-lime-400 text-black text-xs font-bold rounded hover:bg-lime-300">Call</button>
 </td>
 </tr>
 `).join('');
 }

 function searchLeads() {
 const term = document.getElementById('searchInput').value.toLowerCase();
 const filtered = leads.filter(l => 
 l.business.toLowerCase().includes(term) || 
 l.product.toLowerCase().includes(term)
 );
 renderLeads(filtered);
 }

 function filterStatus() {
 const status = document.getElementById('statusFilter').value;
 if (status === 'All Status') return renderLeads(leads);
 const filtered = leads.filter(l => l.status === status);
 renderLeads(filtered);
 }

 function callBusiness(phone) {
 // Mobile: initiates call, Desktop: copies to clipboard
 if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
 window.location.href = 'tel:' + phone.replace(/\D/g, '');
 } else {
 navigator.clipboard.writeText(phone);
 alert('Phone copied: ' + phone);
 }
 }

 function updateLeadStatus(select, phone) {
 const index = leads.findIndex(l => l.phone === phone);
 if (index > -1) leads[index].status = select.value;
 }

 function exportToCSV() {
 const csv = ['Business,Phone,Product Fit,Notes,Status', 
 ...leads.map(l => `"${l.business}","${l.phone}","${l.product}","${l.notes}","${l.status}"`)
 ].join('\n');
 
 const blob = new Blob([csv], { type: 'text/csv' });
 const url = URL.createObjectURL(blob);
 const a = document.createElement('a');
 a.href = url;
 a.download = 'sparksphear-leads.csv';
 a.click();
 }

 // Initialize
 renderLeads(leads);
 
 // Load from API if available
 fetch('/api/leads')
 .then(r => r.json())
 .then(data => {
 if (data.leads) leads = data.leads;
 renderLeads(leads);
 })
 .catch(() => console.log('Using local leads data'));
 </script>
</body>
</html>
